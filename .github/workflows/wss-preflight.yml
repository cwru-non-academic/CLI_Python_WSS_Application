name: WSS CLI preflight
run-name: WSS preflight ${{ fromJSON(inputs.candidate_json).run_id }} / ${{ inputs.correlation_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_json: {description: Exact Core producer tuple, required: true, type: string}
      wrapper_sha: {required: true, type: string}
      cli_sha: {required: true, type: string}
      correlation_id: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: python-preflight-cli-${{ inputs.correlation_id }}
  cancel-in-progress: false
jobs:
  tooling:
    name: Bind reviewed Python preflight tooling
    runs-on: ubuntu-latest
    outputs:
      tools_sha: ${{ steps.binding.outputs.tools_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: a222fd8aec1d0bc927d8584f0875ba5a6aca42ad
          path: tools
          persist-credentials: false
      - name: Verify caller-owned immutable tooling pin
        id: binding
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/CLI_Python_WSS_Application' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main') -or $env:GITHUB_WORKFLOW_REF -cne "$env:GITHUB_REPOSITORY/.github/workflows/wss-preflight.yml@$env:GITHUB_REF" -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA){throw 'Unregistered CLI preflight caller.'}
          if((& git -C source rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0){throw 'CLI workflow source mismatch.'}
          if(@(& git -C source status --porcelain --untracked-files=all --ignore-submodules=all).Count -or $LASTEXITCODE -ne 0){throw 'CLI workflow source must remain clean.'}
          . ./source/.github/scripts/Read-OrdinaryPythonTooling.ps1
          $sha=Get-OrdinaryPythonToolsSha "$env:GITHUB_WORKSPACE/source" $env:GITHUB_SHA
          Assert-OrdinaryPythonToolsCheckout "$env:GITHUB_WORKSPACE/tools" $sha
          "tools_sha=$sha" >> $env:GITHUB_OUTPUT
  validate:
    needs: tooling
    uses: cwru-non-academic/Python_WSS_Integration_Lib/.github/workflows/_python-validation.yml@a222fd8aec1d0bc927d8584f0875ba5a6aca42ad
    with:
      tools_sha: ${{ needs.tooling.outputs.tools_sha }}
      role: cli
      mode: candidate
      wrapper_sha: ${{ inputs.wrapper_sha }}
      cli_sha: ${{ inputs.cli_sha }}
      candidate_json: ${{ inputs.candidate_json }}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
  acceptance:
    name: CLI general conformance
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped or failed prerequisite/conformance
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: a222fd8aec1d0bc927d8584f0875ba5a6aca42ad
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: python-preflight-evidence
          path: ${{ runner.temp }}/normalized-evidence
      - name: Add normalized candidate binding after all existing proofs passed
        shell: pwsh
        env:
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          ./tools/.github/scripts/Write-CandidateProvenance.ps1 -CandidateJson $env:CANDIDATE_JSON -EvidenceRoot "$env:RUNNER_TEMP/normalized-evidence" -OutputPath "$env:RUNNER_TEMP/candidate-provenance/candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wss-candidate-provenance
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate-provenance/candidate.json
