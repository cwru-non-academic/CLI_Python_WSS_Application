name: WSS CLI preflight
run-name: WSS preflight ${{ fromJSON(inputs.candidate_json).run_id }} / ${{ inputs.correlation_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_json: {description: Exact Core producer tuple, required: true, type: string}
      wrapper_sha: {required: true, type: string}
      cli_sha: {required: true, type: string}
      correlation_id: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: python-preflight-cli-${{ inputs.correlation_id }}
  cancel-in-progress: false
jobs:
  validate:
    uses: cwru-non-academic/Python_WSS_Integration_Lib/.github/workflows/_python-validation.yml@94d78c49a622bd4d15587f869c4cd5ac063c13b8
    with:
      role: cli
      mode: candidate
      wrapper_sha: ${{ inputs.wrapper_sha }}
      cli_sha: ${{ inputs.cli_sha }}
      candidate_json: ${{ inputs.candidate_json }}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
  acceptance:
    name: CLI general conformance
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped or failed prerequisite/conformance
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: 733d661baf2d259688fe0623bba0ae9adc1ce9ad
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: python-preflight-evidence
          path: ${{ runner.temp }}/normalized-evidence
      - name: Add normalized candidate binding after all existing proofs passed
        shell: pwsh
        env:
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          ./tools/.github/scripts/Write-CandidateProvenance.ps1 -CandidateJson $env:CANDIDATE_JSON -EvidenceRoot "$env:RUNNER_TEMP/normalized-evidence" -OutputPath "$env:RUNNER_TEMP/candidate-provenance/candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wss-candidate-provenance
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate-provenance/candidate.json
