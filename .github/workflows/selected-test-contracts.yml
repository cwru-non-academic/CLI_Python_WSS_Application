name: Selected test source contracts
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    name: Selected test source contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reject malformed, mutable and coupled selected sources
        run: python -B .github/scripts/tests/test_selected_cli_source.py
      - name: Verify selected suite credential isolation
        shell: pwsh
        run: ./.github/scripts/tests/SelectedProcessIsolation.Tests.ps1

      - name: Verify ordinary immutable tooling pins
        shell: pwsh
        run: ./.github/scripts/tests/OrdinaryPythonTooling.Tests.ps1

      - name: Reject selected child baseline and authority mutations
        shell: pwsh
        run: ./.github/scripts/tests/TrustedBaseline.Tests.ps1
      - name: Check out immutable validator tooling
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ae75d94ef038275b704b089c7920803f69ce1889
          fetch-depth: 0
          path: baseline-tools
          persist-credentials: false
      - name: Validate baseline content contracts (synthetic, not runtime acceptance)
        shell: pwsh
        run: ./.github/scripts/tests/TrustedPythonCliBaseline.Tests.ps1 -ToolsRoot ./baseline-tools
      - name: Install pinned workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate candidate workflow tooling authority
        shell: pwsh
        run: |
          ./.github/scripts/tests/CandidateToolingWorkflow.Tests.ps1 -ToolsRoot ./baseline-tools
          ./baseline-tools/.github/scripts/tests/Test-PythonReusableTooling.ps1
          ./baseline-tools/.github/scripts/tests/Test-PythonCandidateTooling.ps1 -CliRoot $env:GITHUB_WORKSPACE
