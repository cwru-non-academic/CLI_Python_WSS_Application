[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hfi-wss-cli"
version = "0.1.0"
description = "Application CLI for the HFI WSS Python interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pythonnet>=3.0.0",
]

[project.scripts]
wss-cli = "wss_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
